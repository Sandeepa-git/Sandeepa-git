<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="How I build: from idea to cloud — websites, AI chatbots, online stores, cloud and DevOps">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes dash { to { stroke-dashoffset: -320; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes glow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .95; } }
    .n1 { animation: rise .8s ease-out .2s both; }
    .n2 { animation: rise .8s ease-out .5s both; }
    .n3 { animation: rise .8s ease-out .8s both; }
    .n4 { animation: rise .8s ease-out 1.1s both; }
    .n5 { animation: rise .8s ease-out 1.4s both; }
    .flow { stroke-dasharray: 8 12; animation: dash 5s linear infinite; }
    .live { animation: pulse 1.8s ease-in-out infinite; }
    .core { animation: glow 3s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <radialGradient id="coreG"><stop offset="0" stop-color="#F7941D" stop-opacity=".35"/><stop offset="1" stop-color="#F7941D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <clipPath id="frame"><rect width="1600" height="900" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <circle cx="800" cy="520" r="300" fill="url(#coreG)"/>

    <g class="n1 sans">
      <text class="mono" x="80" y="110" font-size="20" fill="#F7941D" letter-spacing="6">// 03 — WHAT I BUILD</text>
      <text x="78" y="180" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.5">From idea to the cloud</text>
    </g>

    <!-- Flow lines from core to services -->
    <g fill="none" stroke-width="2.5">
      <path class="flow" d="M800 520 C620 520 560 330 400 330" stroke="#F7941D" stroke-opacity=".6"/>
      <path class="flow" d="M800 520 C980 520 1040 330 1200 330" stroke="#7cc0ff" stroke-opacity=".6"/>
      <path class="flow" d="M800 520 C620 520 560 720 400 720" stroke="#7cc0ff" stroke-opacity=".6"/>
      <path class="flow" d="M800 520 C980 520 1040 720 1200 720" stroke="#F7941D" stroke-opacity=".6"/>
    </g>

    <!-- Core -->
    <g class="n2">
      <circle class="core" cx="800" cy="520" r="112" fill="#0b0f18" stroke="#F7941D" stroke-width="2.5"/>
      <circle cx="800" cy="520" r="88" fill="none" stroke="#fff" stroke-opacity=".08"/>
      <text class="sans" x="800" y="508" text-anchor="middle" font-size="22" fill="#8b93a7">YOUR</text>
      <text class="sans" x="800" y="546" text-anchor="middle" font-size="36" font-weight="800" fill="#fff">IDEA</text>
    </g>

    <!-- Service nodes: 420x150 -->
    <g class="n3">
      <rect x="80" y="255" width="420" height="150" rx="22" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".45"/>
      <text class="mono" x="112" y="298" font-size="15" fill="#F7941D" letter-spacing="3">WEB</text>
      <text class="sans" x="112" y="338" font-size="28" font-weight="700" fill="#fff">Websites &amp; web apps</text>
      <text class="sans" x="112" y="372" font-size="18" fill="#8b93a7">Fast, SEO-friendly · Next.js &amp; React</text>
    </g>
    <g class="n3">
      <rect x="1100" y="255" width="420" height="150" rx="22" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".45"/>
      <text class="mono" x="1132" y="298" font-size="15" fill="#7cc0ff" letter-spacing="3">AI</text>
      <text class="sans" x="1132" y="338" font-size="28" font-weight="700" fill="#fff">AI chatbots &amp; bots</text>
      <text class="sans" x="1132" y="372" font-size="18" fill="#8b93a7">Website assistants · Telegram bots</text>
    </g>
    <g class="n4">
      <rect x="80" y="645" width="420" height="150" rx="22" fill="#0b0f18" stroke="#1E90FF" stroke-opacity=".45"/>
      <text class="mono" x="112" y="688" font-size="15" fill="#7cc0ff" letter-spacing="3">CLOUD</text>
      <text class="sans" x="112" y="728" font-size="28" font-weight="700" fill="#fff">Cloud &amp; DevOps</text>
      <text class="sans" x="112" y="762" font-size="18" fill="#8b93a7">Azure · AWS · CI/CD · Kubernetes</text>
    </g>
    <g class="n4">
      <rect x="1100" y="645" width="420" height="150" rx="22" fill="#0b0f18" stroke="#F7941D" stroke-opacity=".45"/>
      <text class="mono" x="1132" y="688" font-size="15" fill="#F7941D" letter-spacing="3">COMMERCE</text>
      <text class="sans" x="1132" y="728" font-size="28" font-weight="700" fill="#fff">Online stores</text>
      <text class="sans" x="1132" y="762" font-size="18" fill="#8b93a7">WhatsApp ordering · fast checkout</text>
    </g>

    <!-- status chip -->
    <g class="n5 mono" font-size="17">
      <rect x="1180" y="88" width="340" height="46" rx="23" fill="#28c840" fill-opacity=".1" stroke="#28c840" stroke-opacity=".45"/>
      <circle cx="1210" cy="111" r="6" fill="#28c840" class="live"/>
      <text x="1230" y="117" fill="#8ff0a4">Taking new projects</text>
    </g>

    <rect x="1" y="1" width="1598" height="898" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
