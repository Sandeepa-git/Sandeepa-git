<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-label="CI/CD pipeline: the Octocat is at the Test stage">
  <style>
    @keyframes run { from { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateX(407px); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes halo { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes core { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(.8); opacity: .3; } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look { 0%,40%,100% { transform: translateX(0); } 50%,80% { transform: translateX(2.5px); } }
    @keyframes sway1 { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
    @keyframes sway2 { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
    @keyframes bar { from { transform: scaleX(0); } }
    @keyframes shimmer { from { transform: translateX(-200px); } to { transform: translateX(1600px); } }
    @keyframes dots { 0%,20% { opacity: 0; } 40%,100% { opacity: 1; } }
    @keyframes cur { 50% { opacity: 0; } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0,0) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
    .pulse { animation: run 2.7s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 4s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: 50% 50%; animation: halo 2.2s ease-in-out infinite; }
    .core { animation: core 1s ease-in-out infinite; }
    .ahead { stroke-dasharray: 2 16; animation: flow 1.6s linear infinite; }
    .obody { animation: bob 2.6s ease-in-out infinite; }
    .oshadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow 2.6s ease-in-out infinite; }
    .oeyes { animation: look 6s ease-in-out infinite; }
    .oblink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.2s infinite; }
    .ot1 { transform-box: fill-box; transform-origin: 50% 0; animation: sway1 2.2s ease-in-out infinite; }
    .ot2 { transform-box: fill-box; transform-origin: 50% 0; animation: sway2 2.5s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: bar 1.6s cubic-bezier(.2,.7,.2,1) both; }
    .shimmer { animation: shimmer 5s ease-in-out infinite; }
    .d1 { animation: dots 1.2s infinite; } .d2 { animation: dots 1.2s .2s infinite; } .d3 { animation: dots 1.2s .4s infinite; }
    .cur { animation: cur 1s step-end infinite; }
    .spark { animation: spark 1.8s ease-out infinite; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1320"/><stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="done" x1="0" x2="1">
      <stop offset="0" stop-color="#28c840" stop-opacity=".35"/><stop offset="1" stop-color="#28c840"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" x2="1">
      <stop offset="0" stop-color="#F7941D"/><stop offset="1" stop-color="#F7941D"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect x="40" y="10" width="1520" height="280" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="40" y="10" width="1520" height="280" fill="url(#card)"/>
    <rect x="40" y="10" width="1520" height="280" fill="url(#grid)"/>
    <rect class="shimmer" x="0" y="10" width="260" height="280" fill="url(#sh)"/>
  </g>
  <rect x="40.5" y="10.5" width="1519" height="279" rx="26" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace">
    <!-- header -->
    <circle cx="82" cy="48" r="6" fill="#F7941D" class="core"/>
    <text x="98" y="54" font-size="17" fill="#e6e9f0">ship.yml</text>
    <text x="196" y="54" font-size="17" fill="#5c6478">· run #130 · main</text>
    <text x="800" y="54" text-anchor="middle" font-size="16" fill="#8b93a7"><tspan fill="#F7941D">$</tspan> npm test -- --coverage<tspan class="cur" fill="#F7941D"> ▍</tspan></text>
    <rect x="1260" y="30" width="150" height="34" rx="17" fill="#F7941D" fill-opacity=".12" stroke="#F7941D" stroke-opacity=".55"/>
    <text x="1320" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#F7941D">RUNNING</text>
    <g fill="#F7941D" font-size="15" font-weight="700"><text class="d1" x="1362" y="53">.</text><text class="d2" x="1370" y="53">.</text><text class="d3" x="1378" y="53">.</text></g>
    <text x="1528" y="54" text-anchor="end" font-size="15" fill="#5c6478">1m 09s</text>

    <!-- progress -->
    <rect x="82" y="76" width="1436" height="4" rx="2" fill="#fff" fill-opacity=".06"/>
    <rect class="bar" x="82" y="76" width="615" height="4" rx="2" fill="url(#prog)"/>

    <!-- track -->
    <line x1="190" y1="220" x2="1410" y2="220" stroke="#1f2636" stroke-width="8" stroke-linecap="round"/>
    <line x1="597" y1="220" x2="1410" y2="220" stroke="#5c6478" stroke-width="3" stroke-linecap="round" class="ahead"/>
    <line x1="190" y1="220" x2="597" y2="220" stroke="url(#done)" stroke-width="6" stroke-linecap="round"/>
    <circle class="pulse" style="animation-delay:0s" cx="190" cy="220" r="4.5" fill="#b9ffc7"/><circle class="pulse" style="animation-delay:-0.9s" cx="190" cy="220" r="4.5" fill="#b9ffc7"/><circle class="pulse" style="animation-delay:-1.8s" cx="190" cy="220" r="4.5" fill="#b9ffc7"/>
    <circle cx="190" cy="220" r="17" fill="#0e2416" stroke="#28c840" stroke-width="2.5"/><path d="M184 220l4 5 8-10" fill="none" stroke="#28c840" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="393" cy="220" r="17" fill="#0e2416" stroke="#28c840" stroke-width="2.5"/><path d="M387 220l4 5 8-10" fill="none" stroke="#28c840" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="halo" cx="597" cy="220" r="30" fill="#F7941D" fill-opacity=".14"/><circle class="spin" cx="597" cy="220" r="24" fill="none" stroke="#F7941D" stroke-width="2" stroke-dasharray="10 8"/><circle cx="597" cy="220" r="17" fill="#120d06" stroke="#F7941D" stroke-width="3"/><circle class="core" cx="597" cy="220" r="5" fill="#F7941D"/><circle cx="800" cy="220" r="14" fill="#0b0f18" stroke="#2f3747" stroke-width="2.5"/><circle cx="1003" cy="220" r="14" fill="#0b0f18" stroke="#2f3747" stroke-width="2.5"/><circle cx="1207" cy="220" r="14" fill="#0b0f18" stroke="#2f3747" stroke-width="2.5"/><circle cx="1410" cy="220" r="14" fill="#0b0f18" stroke="#2f3747" stroke-width="2.5"/>
    <circle cx="190" cy="176" r="5" fill="none" stroke="#8ff0a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M178 176h7M195 176h7" fill="none" stroke="#8ff0a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="393" cy="176" r="7" fill="none" stroke="#8ff0a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3.2 2.4"/><circle cx="393" cy="176" r="2.4" fill="#8ff0a4"/><path d="M789 176q11-10 22 0q-11 10-22 0z" fill="none" stroke="#4b5468" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="176" r="3" fill="#4b5468"/><path d="M997 166v20M997 172q0 6 12 6v-6" fill="none" stroke="#4b5468" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1009" cy="170" r="2.6" fill="#4b5468"/><path d="M1207 186v-18M1200 174l7-8 7 8" fill="none" stroke="#4b5468" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1410" cy="176" r="9" fill="none" stroke="#4b5468" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1401 176h18M1410 167q-6 9 0 18q6-9 0-18" fill="none" stroke="#4b5468" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#8ff0a4">Commit</text><text x="393" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#8ff0a4">Build</text><text x="597" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#F7941D">Test</text><text x="800" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#4b5468">Review</text><text x="1003" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#4b5468">Merge</text><text x="1207" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#4b5468">Deploy</text><text x="1410" y="270" text-anchor="middle" font-size="16" font-weight="500" fill="#4b5468">Live</text>
    
  </g>
  
  <g transform="translate(553 82)">
    <ellipse class="oshadow" cx="44" cy="114" rx="34" ry="6" fill="#000" fill-opacity=".5"/>
