<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="140" viewBox="0 0 1600 140" role="img" aria-label="A bird flying down the page">
  <style>
    @keyframes route { 0%, 57.133% { transform: translate(-200px, 74px); opacity: 0; } 57.143% { transform: translate(-200px, 74px); opacity: 1; } 60.714% { transform: translate(300px, 44px); opacity: 1; } 64.286% { transform: translate(800px, 86px); opacity: 1; } 67.857% { transform: translate(1300px, 42px); opacity: 1; } 71.429% { transform: translate(1800px, 70px); opacity: 1; } 71.439%, 100% { transform: translate(1800px, 70px); opacity: 0; } }
    @keyframes flapUp { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-48deg); } }
    @keyframes flapDown { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(36deg); } }
    @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes trail { to { stroke-dashoffset: -60; } }
    .path { animation: route 28.0s linear infinite; }
    .body { transform-box: fill-box; transform-origin: 50% 50%; animation: tilt 1.2s ease-in-out infinite; }
    .wingA { transform-box: fill-box; transform-origin: 85% 90%; animation: flapUp .32s ease-in-out infinite; }
    .wingB { transform-box: fill-box; transform-origin: 85% 10%; animation: flapDown .32s ease-in-out infinite; }
    .trail { stroke-dasharray: 4 14; animation: trail 1s linear infinite; }
  </style>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#F7941D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F7941D" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="80" y="69" width="1440" height="2" fill="url(#line)"/>
  <g transform="">
    <g class="path" transform="translate(-200 74)">
      <path class="trail" d="M-30 4 L-140 10" fill="none" stroke="#7cc0ff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      <g class="body">
        <path class="wingB" d="M-4 4 Q-18 26 -34 22 Q-20 14 -8 2 Z" fill="#1565c0"/>
        <ellipse cx="0" cy="0" rx="24" ry="14" fill="#7cc0ff"/>
        <path d="M-20 -2 L-40 -10 L-34 4 L-42 12 L-20 6 Z" fill="#1E90FF"/>
        <circle cx="20" cy="-8" r="11" fill="#7cc0ff"/>
        <path d="M30 -9 L42 -5 L30 -1 Z" fill="#F7941D"/>
        <circle cx="23" cy="-11" r="2.4" fill="#0b0f18"/>
        <ellipse cx="4" cy="6" rx="12" ry="5" fill="#e6f2ff"/>
        <path class="wingA" d="M-6 -4 Q-20 -34 -38 -16 Q-20 -14 -4 2 Z" fill="#1E90FF"/>
      </g>
    </g>
  </g>
</svg>
