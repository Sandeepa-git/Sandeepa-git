<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="Dev pets: a duck that answers every bug with console.log, a cat that never catches the bug, an on-call dog sleeping through a pager alert, and a bird asking to deploy on Friday">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    /* ---------- Cat chases the bug back and forth, never catches it (12s loop) ---------- */
    @keyframes catX   { 0% { transform: translateX(0); } 44% { transform: translateX(480px); } 56% { transform: translateX(480px); } 94% { transform: translateX(0); } 100% { transform: translateX(0); } }
    @keyframes catFace{ 0%,49.9% { transform: scaleX(1); } 50%,99.9% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
    @keyframes pounce { 0%,40%,52%,90%,100% { transform: translateY(0); } 46% { transform: translateY(-34px); } 96% { transform: translateY(-34px); } }
    @keyframes bugX   { 0% { transform: translate(140px,0); } 44% { transform: translate(620px,0); }
                        47% { transform: translate(560px,-90px); } 52% { transform: translate(420px,-40px); } 56% { transform: translate(350px,0); }
                        94% { transform: translate(-130px,0); } 97% { transform: translate(-40px,-90px); } 100% { transform: translate(140px,0); } }
    @keyframes oops   { 0%,42%,60%,92% { opacity: 0; transform: translateY(8px); } 46%,56% { opacity: 1; transform: none; } 96%,100% { opacity: 1; transform: none; } }
    @keyframes hop    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes legA   { 0%,100% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }
    @keyframes legB   { 0%,100% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } }
    @keyframes tail   { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(14deg); } }
    @keyframes buzz   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes flutter{ 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.25); } }
    .catX  { animation: catX 12s ease-in-out infinite; }
    .catF  { transform-box: fill-box; transform-origin: 50% 50%; animation: catFace 12s linear infinite; }
    .pounce{ animation: pounce 12s ease-in-out infinite; }
    .run   { animation: hop .42s ease-in-out infinite; }
    .legA  { transform-box: fill-box; transform-origin: 50% 0; animation: legA .42s ease-in-out infinite; }
    .legB  { transform-box: fill-box; transform-origin: 50% 0; animation: legB .42s ease-in-out infinite; }
    .tail  { transform-box: fill-box; transform-origin: 100% 100%; animation: tail .9s ease-in-out infinite; }
    .bugX  { animation: bugX 12s ease-in-out infinite; }
    .bugB  { animation: buzz .28s ease-in-out infinite; }
    .wing  { transform-box: fill-box; transform-origin: 50% 100%; animation: flutter .1s linear infinite; }
    .oops  { animation: oops 12s ease-in-out infinite; }

    /* ---------- Duck: rotating rubber-duck debugging advice (12s, 3 lines) ---------- */
    @keyframes say1 { 0%,2% { opacity: 0; } 5%,30% { opacity: 1; } 33%,100% { opacity: 0; } }
    @keyframes say2 { 0%,35% { opacity: 0; } 38%,63% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes say3 { 0%,68% { opacity: 0; } 71%,96% { opacity: 1; } 99%,100% { opacity: 0; } }
    @keyframes bob  { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
    @keyframes type { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .s1 { animation: say1 12s infinite; } .s2 { animation: say2 12s infinite; } .s3 { animation: say3 12s infinite; }
    .duck { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite; }
    .ln1 { animation: type 1.1s ease-in-out infinite; } .ln2 { animation: type 1.1s ease-in-out .3s infinite; } .ln3 { animation: type 1.1s ease-in-out .6s infinite; }

    /* ---------- Dog: on-call, sleeping through the pager ---------- */
    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
    @keyframes zz      { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(26px,-58px) scale(1.15); } }
    @keyframes pager   { 0%,70%,100% { transform: rotate(0); } 72%,76%,80%,84% { transform: rotate(-12deg); } 74%,78%,82%,86% { transform: rotate(12deg); } }
    @keyframes alert   { 0%,69%,90%,100% { opacity: 0; } 72%,87% { opacity: 1; } }
    @keyframes ear     { 0%,74%,84%,100% { transform: rotate(0); } 78% { transform: rotate(-22deg); } }
    @keyframes dream   { 0%,8% { opacity: 0; } 14%,58% { opacity: 1; } 64%,100% { opacity: 0; } }
    .dog   { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3s ease-in-out infinite; }
    .z1 { animation: zz 3s ease-out infinite; } .z2 { animation: zz 3s ease-out 1s infinite; } .z3 { animation: zz 3s ease-out 2s infinite; }
    .pager { transform-box: fill-box; transform-origin: 50% 50%; animation: pager 8s ease-in-out infinite; }
    .alert { animation: alert 8s ease-in-out infinite; }
    .ear   { transform-box: fill-box; transform-origin: 70% 10%; animation: ear 8s ease-in-out infinite; }
    .dream { animation: dream 8s ease-in-out infinite; }

    /* ---------- Bird flies over with a banner (16s) ---------- */
    @keyframes fly  { from { transform: translate(-320px, 0); } to { transform: translate(1900px, 0); } }
    @keyframes glide{ 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes flap { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-40deg); } }
    @keyframes wave { 0%,100% { transform: skewY(0); } 50% { transform: skewY(-3deg); } }
    .fly   { animation: fly 16s linear -6s infinite; }
    .glide { animation: glide 2s ease-in-out infinite; }
    .flap  { transform-box: fill-box; transform-origin: 0% 100%; animation: flap .32s ease-in-out infinite; }
    .flag  { transform-box: fill-box; transform-origin: 100% 50%; animation: wave 1.2s ease-in-out infinite; }

    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
    .t1 { animation: twinkle 3s ease-in-out infinite; } .t2 { animation: twinkle 4s ease-in-out 1s infinite; } .t3 { animation: twinkle 5s ease-in-out 2s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090f"/><stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1">
      <stop offset="0" stop-color="#F7941D" stop-opacity="0"/><stop offset=".5" stop-color="#F7941D" stop-opacity=".6"/><stop offset="1" stop-color="#F7941D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="480" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="480" fill="url(#bg)"/>
    <g fill="#fff">
      <circle class="t1" cx="560" cy="60" r="2"/><circle class="t2" cx="930" cy="90" r="1.6"/>
      <circle class="t3" cx="1180" cy="52" r="2"/><circle class="t1" cx="1420" cy="96" r="1.6"/><circle class="t2" cx="760" cy="150" r="1.4"/>
    </g>

    <text class="mono" x="80" y="78" font-size="20" fill="#F7941D" letter-spacing="6">// DEV PETS</text>
    <text class="sans" x="78" y="128" font-size="40" font-weight="800" fill="#fff" letter-spacing="-1">The team behind the code</text>
    <text class="mono" x="80" y="160" font-size="16" fill="#8b93a7">4 employees · 0 salaries · infinite snacks</text>

    <!-- floor -->
    <rect x="0" y="398" width="1600" height="2" fill="url(#floor)"/>
    <text class="mono" x="800" y="456" text-anchor="middle" font-size="14" fill="#8b93a7" fill-opacity=".6">while (alive) { code(); eat(); sleep(); }  ·  pets.status = "200 OK"</text>


    <!-- ===== Duck: rubber-duck debugging (left zone) ===== -->
    <g transform="translate(230 278)">
      <rect x="-90" y="102" width="200" height="12" rx="4" fill="#2a3346"/>
      <rect x="-76" y="114" width="10" height="14" fill="#2a3346"/>
      <rect x="86" y="114" width="10" height="14" fill="#2a3346"/>
      <rect x="22" y="58" width="74" height="44" rx="5" fill="#1b2232" stroke="#7cc0ff" stroke-opacity=".6"/>
      <rect class="ln1" x="30" y="66" width="56" height="5" rx="2" fill="#F7941D"/>
      <rect class="ln2" x="30" y="76" width="38" height="5" rx="2" fill="#7cc0ff"/>
      <rect class="ln3" x="30" y="86" width="46" height="5" rx="2" fill="#ff7b72"/>
      <g class="duck">
        <ellipse cx="-20" cy="84" rx="40" ry="23" fill="#FFC93C"/>
        <circle cx="-36" cy="48" r="23" fill="#FFC93C"/>
        <path d="M-59 48 L-78 54 L-59 58 Z" fill="#F7941D"/>
        <circle cx="-41" cy="42" r="4" fill="#0b0f18"/><circle cx="-40" cy="41" r="1.3" fill="#fff"/>
        <path d="M-6 78 Q8 70 12 84" fill="none" stroke="#e8a800" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-41" cy="42" r="8" fill="none" stroke="#0b0f18" stroke-width="2"/>
      </g>
      <g transform="translate(-60 -60)">
        <rect x="-60" y="-34" width="300" height="48" rx="14" fill="#fff"/>
        <path d="M-6 14 L4 30 L14 14 Z" fill="#fff"/>
        <g class="mono" font-size="16" fill="#0b0f18">
          <text class="s1" x="90" y="-4" text-anchor="middle">Have you tried console.log?</text>
          <text class="s2" x="90" y="-4" text-anchor="middle">Works on my machine. Quack.</text>
          <text class="s3" x="90" y="-4" text-anchor="middle">It was a missing semicolon.</text>
        </g>
      </g>
      <text class="mono" x="10" y="150" text-anchor="middle" font-size="15" fill="#8b93a7">debug.duck · senior engineer</text>
    </g>

    <!-- ===== Cat chases the bug (middle zone) ===== -->
    <g transform="translate(470 318)">
      <g class="bugX"><g transform="translate(0 30)"><g class="bugB">
        <ellipse cx="0" cy="0" rx="13" ry="10" fill="#ff5f57"/>
        <circle cx="13" cy="-2" r="6.5" fill="#0b0f18"/>
        <path d="M-4 -8 V8 M-9 -6 V6" stroke="#0b0f18" stroke-width="1.6" stroke-opacity=".5"/>
        <path class="wing" d="M-6 -7 Q0 -24 6 -7 Z" fill="#fff" fill-opacity=".75"/>
        <path d="M16 -7 L22 -15 M16 -4 L24 -8" stroke="#0b0f18" stroke-width="1.6"/>
      </g></g></g>
      <g class="catX">
        <g class="oops">
          <rect x="-34" y="-62" width="200" height="34" rx="10" fill="#ff5f57" fill-opacity=".15" stroke="#ff5f57" stroke-opacity=".7"/>
          <text class="mono" x="66" y="-39" text-anchor="middle" font-size="15" fill="#ff7b72">Uncaught BugException</text>
        </g>
        <g class="pounce"><g class="catF"><g class="run">
          <path class="tail" d="M-6 36 Q-40 30 -36 0" fill="none" stroke="#3b4256" stroke-width="9" stroke-linecap="round"/>
          <ellipse cx="34" cy="44" rx="44" ry="22" fill="#3b4256"/>
          <circle cx="86" cy="30" r="22" fill="#3b4256"/>
          <path d="M70 14 L74 -6 L84 10 Z" fill="#3b4256"/><path d="M90 10 L100 -6 L104 14 Z" fill="#3b4256"/>
          <path d="M74 8 L76 -1 L81 7 Z" fill="#F7941D" fill-opacity=".7"/><path d="M93 7 L99 -1 L101 9 Z" fill="#F7941D" fill-opacity=".7"/>
          <circle cx="82" cy="28" r="4.5" fill="#F7941D"/><circle cx="96" cy="28" r="4.5" fill="#F7941D"/>
          <circle cx="84" cy="28" r="2" fill="#0b0f18"/><circle cx="98" cy="28" r="2" fill="#0b0f18"/>
          <path d="M88 36 l2 2 l2 -2" fill="none" stroke="#ff9aa2" stroke-width="2"/>
          <path d="M100 36 L116 33 M100 39 L116 40" stroke="#8b93a7" stroke-width="1.2"/>
          <rect class="legA" x="10" y="58" width="9" height="22" rx="4" fill="#2d3344"/>
          <rect class="legB" x="24" y="58" width="9" height="22" rx="4" fill="#3b4256"/>
          <rect class="legB" x="50" y="58" width="9" height="22" rx="4" fill="#2d3344"/>
          <rect class="legA" x="62" y="58" width="9" height="22" rx="4" fill="#3b4256"/>
        </g></g></g>
      </g>
      <text class="mono" x="300" y="110" text-anchor="middle" font-size="15" fill="#8b93a7">try { cat.catch(bug) } // since 2019</text>
    </g>

    <!-- ===== Dog: on call, asleep (right zone) ===== -->
    <g transform="translate(1330 306)">
      <ellipse cx="0" cy="92" rx="118" ry="12" fill="#000" fill-opacity=".35"/>
      <ellipse cx="0" cy="86" rx="108" ry="14" fill="#1E90FF" fill-opacity=".25"/>
      <g class="dog">
        <path d="M70 60 Q100 40 104 60" fill="none" stroke="#c98a4b" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="10" cy="62" rx="70" ry="28" fill="#d99a5b"/>
        <circle cx="-58" cy="52" r="28" fill="#d99a5b"/>
        <g class="ear"><ellipse cx="-70" cy="36" rx="11" ry="20" fill="#a86b35" transform="rotate(-20 -70 36)"/></g>
        <ellipse cx="-80" cy="60" rx="14" ry="10" fill="#f2c9a0"/>
        <circle cx="-90" cy="56" r="4" fill="#0b0f18"/>
        <path d="M-66 48 q6 4 12 0" fill="none" stroke="#0b0f18" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-30" cy="84" rx="18" ry="7" fill="#c98a4b"/>
        <ellipse cx="40" cy="86" rx="18" ry="7" fill="#c98a4b"/>
      </g>
      <g transform="translate(92 70)">
        <g class="pager">
          <rect x="-16" y="-10" width="32" height="20" rx="4" fill="#1b2232" stroke="#ff5f57"/>
          <rect x="-11" y="-5" width="22" height="7" rx="2" fill="#ff5f57" fill-opacity=".6"/>
        </g>
        <g class="alert">
          <rect x="-96" y="-58" width="176" height="30" rx="8" fill="#ff5f57"/>
          <text class="mono" x="-8" y="-38" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PROD IS DOWN!!!</text>
        </g>
      </g>
      <g class="mono" font-weight="700" fill="#7cc0ff">
        <text class="z1" x="-62" y="12" font-size="22">z</text>
        <text class="z2" x="-52" y="2" font-size="28">z</text>
        <text class="z3" x="-42" y="-8" font-size="34">Z</text>
      </g>
      <g class="dream">
        <circle cx="-110" cy="10" r="5" fill="#fff" fill-opacity=".85"/>
        <circle cx="-126" cy="-40" r="8" fill="#fff" fill-opacity=".85"/><circle cx="-118" cy="-14" r="6" fill="#fff" fill-opacity=".85"/>
        <rect x="-300" y="-112" width="190" height="44" rx="22" fill="#fff" fill-opacity=".92"/>
        <text class="mono" x="-205" y="-84" text-anchor="middle" font-size="15" fill="#0b0f18">dreaming of 0 bugs</text>
      </g>
      <text class="mono" x="0" y="138" text-anchor="middle" font-size="15" fill="#8b93a7">on-call · sleep(8h)</text>
    </g>

    <!-- ===== Bird with a banner (top) ===== -->
    <g class="fly"><g transform="translate(0 205)"><g class="glide">
      <path d="M-40 6 L-70 10" stroke="#8b93a7" stroke-width="1.5"/>
      <g class="flag">
        <path d="M-300 -14 H-70 L-62 10 L-70 34 H-300 Q-292 10 -300 -14 Z" fill="#F7941D"/>
        <text class="mono" x="-186" y="16" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0f18">DEPLOY ON FRIDAY?</text>
      </g>
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#7cc0ff"/>
      <circle cx="20" cy="-10" r="13" fill="#7cc0ff"/>
      <path d="M32 -10 L44 -6 L32 -2 Z" fill="#F7941D"/>
      <circle cx="23" cy="-13" r="2.6" fill="#0b0f18"/>
      <path class="flap" d="M-6 -6 Q-24 -40 -40 -14 Q-22 -16 -6 -2 Z" fill="#1E90FF"/>
    </g></g></g>

    <rect x="1" y="1" width="1598" height="478" rx="36" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  </g>
</svg>
